name: backfill
on:
  workflow_dispatch:
  push:
    branches: [claude/data-pipeline]
    paths: [.github/workflows/backfill.yml]
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download past seasons' box scores
        run: python -m bb backfill
      - name: Sample prop lines for opening night
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python -m bb lines --date 2026-10-20
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Backfill box scores" || echo "nothing to commit"
          git push
