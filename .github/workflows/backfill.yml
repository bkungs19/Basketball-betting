name: backfill
# One-off: download past seasons' box scores. Run it from the Actions tab if
# the data ever needs rebuilding.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to download, e.g. 2018-19 2019-20 (blank: the model's usual seasons)"
        required: false
        default: ""
permissions:
  contents: write
# Its own group: it only adds past seasons' files, so the daily picks keep running meanwhile.
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download past seasons' box scores
        env:
          SEASONS: ${{ inputs.seasons }}
        run: python -m bb backfill ${SEASONS:+--seasons $SEASONS}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Backfill box scores" || echo "nothing to commit"
          git pull --rebase
          git push
