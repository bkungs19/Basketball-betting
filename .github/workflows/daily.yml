name: daily picks
# Runs every two hours from 4am to 3pm Eastern, because GitHub often starts
# scheduled runs hours late (odd minutes avoid the busy top of the hour). Each
# run updates stats, grades yesterday, and from 10 hours before the first game
# pulls lines, retrains the model, makes early picks and publishes the
# dashboard. The first run that lands within 5.5 hours of the day's first game
# then holds its machine (the pregame job) and makes the final picks an hour
# before tip-off, so they never depend on GitHub's timing. Later runs keep the
# final picks and skip the odds fetch. Actions minutes are free for public
# repos, so the wait costs nothing.
on:
  schedule:
    - cron: "7 8 * * *"
    - cron: "7 10 * * *"
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the daily pipeline
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python -m bb daily
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily picks $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
  pregame:
    needs: picks
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait until an hour before the first game
        id: wait
        run: python -m bb wait
      - name: Make the pregame picks
        if: steps.wait.outputs.refresh == 'true'
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: |
          git pull --rebase
          python -m bb daily --final
      - name: Save data
        if: steps.wait.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Pregame picks $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - if: steps.wait.outputs.refresh == 'true'
        uses: actions/configure-pages@v5
      - if: steps.wait.outputs.refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-pregame
      - id: deploy
        if: steps.wait.outputs.refresh == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-pregame
