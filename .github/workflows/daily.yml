name: daily picks
# Runs before games: about 11am and 5:30pm Eastern (GitHub may start it a few
# minutes late). Updates stats, grades yesterday, pulls lines, retrains the
# model, picks the parlay and publishes the dashboard.
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the daily pipeline
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python -m bb daily
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily picks $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
